<style>
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #EFEEEA;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; }
  input { font: inherit; }

  /* Hide scrollbars on day-tabs row */
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes mrScan {
    0%   { top: 28px; opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { top: 210px; opacity: 0; }
  }
</style>

<script>
  // Tweakable design dials for this exploration. Not pixel values — they
  // reshape the feel of the deck: which directions you see, who the farmer
  // is, and the tone of voice in the copy.
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "focus": "all",
    "supplier": "adam",
    "voice": "warm"
  }/*EDITMODE-END*/;
